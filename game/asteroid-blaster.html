<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Asteroid Blaster</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: monospace; }
canvas { display: block; }
</style>
</head>
<body>
<div id="app"></div>
<script>
// ---- entities ----
class Player {
  constructor(cw, ch) {
    this.x = cw / 2; this.y = ch - 60;
    this.width = 36; this.height = 32;
    this.speed = 5; this.shootCooldown = 0; this.shootDelay = 15;
  }
  move(dx, cw) { this.x = Math.max(this.width/2, Math.min(cw - this.width/2, this.x + dx * this.speed)); }
  update() { if (this.shootCooldown > 0) this.shootCooldown--; }
  canShoot() { return this.shootCooldown === 0; }
  shoot() { this.shootCooldown = this.shootDelay; return new Bullet(this.x, this.y - this.height / 2); }
  draw(ctx) {
    ctx.save(); ctx.translate(this.x, this.y);
    ctx.shadowColor = '#4af'; ctx.shadowBlur = 12;
    ctx.fillStyle = '#4af'; ctx.fillRect(-4, 10, 8, 10);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#7cf';
    ctx.beginPath();
    ctx.moveTo(0, -this.height/2); ctx.lineTo(this.width/2, this.height/2);
    ctx.lineTo(this.width/4, this.height/3); ctx.lineTo(-this.width/4, this.height/3);
    ctx.lineTo(-this.width/2, this.height/2); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#aef';
    ctx.beginPath(); ctx.ellipse(0, -4, 6, 9, 0, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

class Bullet {
  constructor(x, y) { this.x = x; this.y = y; this.speed = 10; this.radius = 3; this.active = true; }
  update() { this.y -= this.speed; }
  isOffscreen() { return this.y < -this.radius; }
  draw(ctx) {
    ctx.save();
    ctx.shadowColor = '#ff0'; ctx.shadowBlur = 8;
    ctx.fillStyle = '#ff0'; ctx.fillRect(this.x-2, this.y-8, 4, 16);
    ctx.fillStyle = '#fff'; ctx.fillRect(this.x-1, this.y-6, 2, 12);
    ctx.restore();
  }
}

class Asteroid {
  constructor(cw, speed, large=false) {
    this.radius = large ? 32 : 18 + Math.random()*10;
    this.x = this.radius + Math.random()*(cw - this.radius*2);
    this.y = -this.radius;
    this.speed = speed; this.active = true;
    this.maxHp = large ? 2 : 1; this.hp = this.maxHp;
    this.rotationSpeed = (Math.random()-0.5)*0.05; this.rotation = 0;
    this.vertices = this._buildVertices();
  }
  _buildVertices() {
    const count = 8 + Math.floor(Math.random()*4), verts = [];
    for (let i = 0; i < count; i++) {
      const a = (i/count)*Math.PI*2, r = this.radius*(0.65+Math.random()*0.35);
      verts.push({x: Math.cos(a)*r, y: Math.sin(a)*r});
    }
    return verts;
  }
  update() { this.y += this.speed; this.rotation += this.rotationSpeed; }
  isOffscreen(ch) { return this.y > ch + this.radius; }
  hit() { this.hp--; return this.hp <= 0; }
  draw(ctx) {
    ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.rotation);
    const dmg = this.hp < this.maxHp;
    ctx.strokeStyle = dmg ? '#f84' : '#aaa'; ctx.fillStyle = dmg ? '#542' : '#444';
    ctx.lineWidth = 2; ctx.shadowColor = dmg ? '#f84' : '#888'; ctx.shadowBlur = dmg ? 6 : 3;
    ctx.beginPath(); ctx.moveTo(this.vertices[0].x, this.vertices[0].y);
    for (let i = 1; i < this.vertices.length; i++) ctx.lineTo(this.vertices[i].x, this.vertices[i].y);
    ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
  }
}

class Particle {
  constructor(x, y, color) {
    this.x = x; this.y = y;
    const a = Math.random()*Math.PI*2, s = 1+Math.random()*4;
    this.vx = Math.cos(a)*s; this.vy = Math.sin(a)*s;
    this.maxLife = 20+Math.floor(Math.random()*20); this.life = this.maxLife;
    this.color = color; this.radius = 2+Math.random()*3;
  }
  update() { this.x += this.vx; this.y += this.vy; this.vy += 0.05; this.life--; }
  isDead() { return this.life <= 0; }
  draw(ctx) {
    ctx.save(); ctx.globalAlpha = this.life/this.maxLife; ctx.fillStyle = this.color;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.radius*(this.life/this.maxLife), 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

class Star {
  constructor(cw, ch) {
    this.cw = cw; this.ch = ch;
    this.x = Math.random()*cw; this.y = Math.random()*ch;
    this.speed = 0.3+Math.random()*1.2; this.brightness = 0.3+Math.random()*0.7;
  }
  update() { this.y += this.speed; if (this.y > this.ch) this.y = 0; }
  draw(ctx) { ctx.save(); ctx.globalAlpha = this.brightness; ctx.fillStyle='#fff'; ctx.fillRect(this.x,this.y,1.5,1.5); ctx.restore(); }
}

// ---- game ----
class Game {
  constructor(canvas) {
    this.W = 480; this.H = 640;
    this.canvas = canvas; canvas.width = this.W; canvas.height = this.H;
    this.ctx = canvas.getContext('2d');
    this.highScore = parseInt(localStorage.getItem('asteroidHS') || '0');
    this._retryListenerAdded = false;
    this.keys = new Set();
    this._initState();
    this._spawnStars();
    this._bindInput();
    this._loop();
  }

  _initState() {
    this.player = new Player(this.W, this.H);
    this.bullets = []; this.asteroids = []; this.particles = [];
    this.score = 0; this.lives = 3; this.level = 1;
    this.asteroidSpeed = 2; this.spawnInterval = 180; this.spawnTimer = 0;
    this.frameCount = 0; this.levelUpDisplay = 0; this.state = 'playing';
  }

  _spawnStars() { this.stars = []; for (let i=0;i<80;i++) this.stars.push(new Star(this.W,this.H)); }

  _bindInput() {
    window.addEventListener('keydown', e => {
      this.keys.add(e.code);
      if (e.code === 'KeyP') this._togglePause();
      if (e.code === 'Space') e.preventDefault();
    });
    window.addEventListener('keyup', e => this.keys.delete(e.code));
  }

  _togglePause() {
    if (this.state === 'playing') this.state = 'paused';
    else if (this.state === 'paused') this.state = 'playing';
  }

  _explode(x, y, color, count=15) { for(let i=0;i<count;i++) this.particles.push(new Particle(x,y,color)); }

  _checkCollisions() {
    for (const b of this.bullets) {
      if (!b.active) continue;
      for (const a of this.asteroids) {
        if (!a.active) continue;
        const dx=b.x-a.x, dy=b.y-a.y;
        if (Math.sqrt(dx*dx+dy*dy) < a.radius+b.radius) {
          b.active = false;
          if (a.hit()) { a.active=false; this.score += a.maxHp>1?150:100; this._explode(a.x,a.y,'#f84'); }
          else this._explode(a.x,a.y,'#fa4',5);
          break;
        }
      }
    }
    for (const a of this.asteroids) {
      if (!a.active) continue;
      const dx=this.player.x-a.x, dy=this.player.y-a.y;
      if (Math.sqrt(dx*dx+dy*dy) < a.radius+14) {
        a.active=false; this.lives--;
        this._explode(a.x,a.y,'#f44'); this._explode(this.player.x,this.player.y,'#4af',20);
        if (this.lives<=0) this._endGame();
      }
    }
  }

  _endGame() {
    this.state='gameover';
    if (this.score>this.highScore) { this.highScore=this.score; localStorage.setItem('asteroidHS',String(this.score)); }
  }

  _updateDifficulty() {
    if (this.score >= this.level*500) {
      this.level++; this.levelUpDisplay=120;
      this.asteroidSpeed = Math.min(2+this.level*0.4, 6);
      this.spawnInterval = Math.max(48, 180-this.level*15);
    }
  }

  _update() {
    this.frameCount++;
    for (const s of this.stars) s.update();
    if (this.keys.has('ArrowLeft')||this.keys.has('KeyA')) this.player.move(-1,this.W);
    if (this.keys.has('ArrowRight')||this.keys.has('KeyD')) this.player.move(1,this.W);
    if (this.keys.has('Space') && this.player.canShoot()) this.bullets.push(this.player.shoot());
    this.player.update();
    for (const b of this.bullets) b.update();
    this.bullets = this.bullets.filter(b => b.active && !b.isOffscreen());
    this.spawnTimer++;
    if (this.spawnTimer >= this.spawnInterval) {
      this.spawnTimer=0;
      this.asteroids.push(new Asteroid(this.W, this.asteroidSpeed, this.level>=5&&Math.random()<0.3));
    }
    for (const a of this.asteroids) a.update();
    for (const a of this.asteroids) {
      if (a.active && a.isOffscreen(this.H)) { a.active=false; this.lives--; if(this.lives<=0) this._endGame(); }
    }
    this.asteroids = this.asteroids.filter(a => a.active);
    this._checkCollisions();
    for (const p of this.particles) p.update();
    this.particles = this.particles.filter(p => !p.isDead());
    if (this.levelUpDisplay>0) this.levelUpDisplay--;
    this._updateDifficulty();
  }

  _drawHUD() {
    const ctx=this.ctx;
    ctx.fillStyle='rgba(0,0,20,0.7)'; ctx.fillRect(0,0,this.W,36);
    ctx.font='bold 14px monospace'; ctx.fillStyle='#7cf'; ctx.fillText(`SCORE: ${this.score}`,10,22);
    ctx.fillStyle='#aaa'; ctx.fillText(`LV ${this.level}`,this.W/2-18,22);
    ctx.fillStyle='#f55'; ctx.fillText('♥'.repeat(this.lives)+'♡'.repeat(Math.max(0,3-this.lives)),this.W-80,22);
  }

  _drawGameOver() {
    const ctx=this.ctx;
    ctx.fillStyle='rgba(0,0,0,0.75)'; ctx.fillRect(0,0,this.W,this.H);
    ctx.textAlign='center';
    ctx.fillStyle='#f55'; ctx.font='bold 48px monospace'; ctx.fillText('GAME OVER',this.W/2,this.H/2-80);
    ctx.fillStyle='#fff'; ctx.font='bold 24px monospace'; ctx.fillText(`SCORE: ${this.score}`,this.W/2,this.H/2-30);
    ctx.fillStyle='#ff0'; ctx.fillText(`BEST: ${this.highScore}`,this.W/2,this.H/2+10);
    const bw=180,bh=48,bx=this.W/2-bw/2,by=this.H/2+50;
    ctx.fillStyle='#4af'; ctx.beginPath(); ctx.roundRect(bx,by,bw,bh,8); ctx.fill();
    ctx.fillStyle='#000'; ctx.font='bold 20px monospace'; ctx.fillText('RETRY',this.W/2,by+30);
    ctx.textAlign='left';
    if (!this._retryListenerAdded) {
      this._retryListenerAdded=true;
      const h = e => {
        if (e instanceof KeyboardEvent && e.code!=='Enter' && e.code!=='Space') return;
        if (e.type==='click') {
          const r=this.canvas.getBoundingClientRect();
          const mx=(e.clientX-r.left)*(this.W/r.width), my=(e.clientY-r.top)*(this.H/r.height);
          if (mx<bx||mx>bx+bw||my<by||my>by+bh) return;
        }
        this._retryListenerAdded=false;
        window.removeEventListener('click',h); window.removeEventListener('keydown',h);
        this._initState();
      };
      window.addEventListener('click',h); window.addEventListener('keydown',h);
    }
  }

  _render() {
    const ctx=this.ctx;
    ctx.fillStyle='#000010'; ctx.fillRect(0,0,this.W,this.H);
    for (const s of this.stars) s.draw(ctx);
    for (const a of this.asteroids) a.draw(ctx);
    for (const b of this.bullets) b.draw(ctx);
    this.player.draw(ctx);
    for (const p of this.particles) p.draw(ctx);
    this._drawHUD();
    if (this.levelUpDisplay>0) {
      ctx.save(); ctx.globalAlpha=Math.min(1,this.levelUpDisplay/30);
      ctx.fillStyle='#ff0'; ctx.font='bold 32px monospace'; ctx.textAlign='center';
      ctx.fillText(`LEVEL ${this.level}!`,this.W/2,this.H/2); ctx.textAlign='left'; ctx.restore();
    }
    if (this.state==='paused') {
      ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(0,0,this.W,this.H);
      ctx.fillStyle='#fff'; ctx.font='bold 36px monospace'; ctx.textAlign='center';
      ctx.fillText('PAUSED',this.W/2,this.H/2);
      ctx.font='16px monospace'; ctx.fillText('Press P to resume',this.W/2,this.H/2+40);
      ctx.textAlign='left';
    }
    if (this.state==='gameover') this._drawGameOver();
  }

  _loop() {
    if (this.state==='playing') this._update();
    this._render();
    requestAnimationFrame(()=>this._loop());
  }
}

const canvas = document.createElement('canvas');
document.getElementById('app').appendChild(canvas);
new Game(canvas);
</script>
</body>
</html>
